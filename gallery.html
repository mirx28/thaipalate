<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | Thai Palate</title>
    <meta name="description" content="Thai Palate gallery in Sydney Olympic Park." />
    <link rel="stylesheet" href="./nav.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap");

      :root {
        --ink: #f4ead7;
        --muted: rgba(244, 234, 215, 0.62);
        --background: #17110d;
        --accent: #c84c35;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

      html, body { width: 100%; min-height: 100%; overflow: hidden; }

      body {
        background:
          radial-gradient(100% 80% at 50% 0%, rgba(200, 76, 53, 0.14), transparent 65%),
          var(--background);
        color: var(--ink);
        font-family: "Instrument Sans", sans-serif;
      }

      .gallery {
        position: relative;
        width: 100%;
        height: 100svh;
        overflow: hidden;
      }

      .menu-title {
        position: fixed;
        z-index: 1;
        top: 50%;
        left: 50%;
        width: max-content;
        color: rgba(244, 234, 215, 0.08);
        font-family: "Instrument Serif", serif;
        font-size: clamp(7rem, 25vw, 24rem);
        font-weight: 400;
        line-height: 0.75;
        pointer-events: none;
        transform: translate(-50%, -50%);
        white-space: nowrap;
      }

      canvas {
        position: fixed;
        z-index: 2;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
        touch-action: none;
      }

      canvas:active { cursor: grabbing; }

      .slide-info {
        position: fixed;
        z-index: 3;
        top: 50%;
        left: 0;
        display: flex;
        justify-content: space-between;
        width: 100%;
        padding: 0 2rem;
        color: var(--ink);
        pointer-events: none;
        transform: translateY(-50%);
      }

      .slide-info p {
        font-family: "Instrument Sans", sans-serif;
        font-size: clamp(0.72rem, 1vw, 0.95rem);
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.4);
      }

      .slide-info p:first-child { color: var(--ink); }
      .slide-info p:last-child { color: var(--muted); }

      .gallery-mark {
        position: fixed;
        z-index: 3;
        top: 1.5rem;
        left: 2rem;
        color: var(--muted);
        font-family: "Instrument Serif", serif;
        font-size: 1.5rem;
      }

      .gallery-mark span { color: var(--accent); }

      @media (max-width: 600px) {
        .slide-info { padding: 0 1rem; }
        .gallery-mark { top: 1rem; left: 1rem; }
      }
    </style>
  </head>
  <body>
    <div class="tp-nav-page">
      <nav class="tp-nav">
        <a class="tp-nav-logo" href="./" aria-label="Thai Palate home"><img src="./public/logo.jpg" alt="Thai Palate" /></a>
        <button class="tp-nav-toggler" type="button" aria-expanded="false" aria-controls="tp-menu">Menu</button>
      </nav>
      <div class="tp-menu" id="tp-menu" aria-hidden="true">
        <div class="tp-menu-content">
          <div class="tp-menu-links">
            <a href="./">Home</a>
            <a href="./menu.html">Menu</a>
            <a href="#">Our History</a>
            <a href="./contact.html">Contact Us</a>
          </div>
          <div class="tp-menu-footer"><p>Locally sourced</p><p>Always welcome</p><p>Open every week</p></div>
        </div>
      </div>
    </div>
    <main class="gallery" aria-label="Thai Palate image gallery">
      <div class="menu-title" aria-hidden="true">Thai Palate</div>
      <p class="gallery-mark">Thai Palate <span>/</span> Gallery</p>
      <div class="slide-info" aria-live="polite">
        <p id="slide-title">Gallery 01</p>
        <p id="slide-count">01</p>
      </div>
      <canvas aria-label="Scrollable Thai Palate photo gallery"></canvas>
    </main>

    <script type="importmap">
      { "imports": { "three": "https://esm.sh/three@0.180.0" } }
    </script>

    <script type="module">
      import * as THREE from "three";

      const slides = Array.from({ length: 14 }, (_, index) => ({
        name: `Gallery ${String(index + 1).padStart(2, "0")}`,
        img: `./public/gallery${index + 1}.jpg`,
      }));

      const config = {
        minHeight: 1,
        maxHeight: 1.5,
        aspectRatio: 1.5,
        gap: 0.05,
        smoothing: 0.05,
        distortionStrength: 2.5,
        distortionSmoothing: 0.1,
        momentumFriction: 0.95,
        momentumThreshold: 0.001,
        wheelSpeed: 0.01,
        wheelMax: 150,
        dragSpeed: 0.01,
        dragMomentum: 0.01,
        touchSpeed: 0.01,
        touchMomentum: 0.1,
      };

      const canvas = document.querySelector("canvas");
      const titleElement = document.querySelector("#slide-title");
      const counterElement = document.querySelector("#slide-count");

      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        preserveDrawingBuffer: true,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x17110d);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        100,
      );
      camera.position.z = 5;

      const wrap = (value, range) => ((value % range) + range) % range;
      const totalSlides = slides.length;
      const slideHeights = Array.from(
        { length: totalSlides },
        () => config.minHeight + Math.random() * (config.maxHeight - config.minHeight),
      );
      const slideOffsets = [];
      let stackPosition = 0;

      for (let index = 0; index < totalSlides; index++) {
        if (index === 0) {
          slideOffsets.push(0);
          stackPosition = slideHeights[0] / 2;
        } else {
          stackPosition += config.gap + slideHeights[index] / 2;
          slideOffsets.push(stackPosition);
          stackPosition += slideHeights[index] / 2;
        }
      }

      const loopLength = stackPosition + config.gap + slideHeights[0] / 2;
      const halfLoop = loopLength / 2;
      const meshes = [];
      const textureLoader = new THREE.TextureLoader();

      for (let index = 0; index < totalSlides; index++) {
        const height = slideHeights[index];
        const width = height * config.aspectRatio;
        const geometry = new THREE.PlaneGeometry(width, height, 32, 16);
        const material = new THREE.MeshBasicMaterial({
          side: THREE.DoubleSide,
          color: 0x999999,
        });
        const mesh = new THREE.Mesh(geometry, material);

        mesh.userData = {
          originalVertices: [...geometry.attributes.position.array],
          offset: slideOffsets[index],
          name: slides[index].name,
          index,
        };

        textureLoader.load(slides[index].img, (texture) => {
          texture.colorSpace = THREE.SRGBColorSpace;
          material.map = texture;
          material.color.set(0xffffff);
          material.needsUpdate = true;

          const imageAspect = texture.image.width / texture.image.height;
          const planeAspect = width / height;
          const ratio = imageAspect / planeAspect;

          if (ratio > 1) mesh.scale.y = 1 / ratio;
          else mesh.scale.x = ratio;
        });

        scene.add(mesh);
        meshes.push(mesh);
      }

      function applyDistortion(mesh, positionY, strength) {
        const positions = mesh.geometry.attributes.position;
        const original = mesh.userData.originalVertices;

        for (let index = 0; index < positions.count; index++) {
          const x = original[index * 3];
          const y = original[index * 3 + 1];
          const distance = Math.sqrt(x * x + (positionY + y) ** 2);
          const falloff = Math.max(0, 1 - distance / 2);
          const bend = Math.pow(Math.sin((falloff * Math.PI) / 2), 1.5);
          positions.setZ(index, bend * strength);
        }

        positions.needsUpdate = true;
        mesh.geometry.computeVertexNormals();
      }

      let scrollPosition = 0;
      let scrollTarget = 0;
      let scrollMomentum = 0;
      let isScrolling = false;
      let lastFrameTime = 0;
      let distortionAmount = 0;
      let distortionTarget = 0;
      let velocityPeak = 0;
      let scrollDirection = 0;
      let directionTarget = 0;
      const velocityHistory = [0, 0, 0, 0, 0];
      let isDragging = false;
      let dragStartY = 0;
      let dragDelta = 0;
      let touchStartY = 0;
      let touchLastY = 0;
      let activeSlideIndex = -1;

      const addDistortionBurst = (amount) => {
        distortionTarget = Math.min(1, distortionTarget + amount);
      };

      window.addEventListener("wheel", (event) => {
        event.preventDefault();
        const clampedDelta = Math.sign(event.deltaY) * Math.min(Math.abs(event.deltaY), config.wheelMax);
        addDistortionBurst(Math.abs(clampedDelta) * 0.001);
        scrollTarget += clampedDelta * config.wheelSpeed;
        isScrolling = true;
        clearTimeout(window._scrollTimeout);
        window._scrollTimeout = setTimeout(() => (isScrolling = false), 150);
      }, { passive: false });

      window.addEventListener("touchstart", (event) => {
        touchStartY = touchLastY = event.touches[0].clientY;
        isScrolling = false;
        scrollMomentum = 0;
      }, { passive: false });

      window.addEventListener("touchmove", (event) => {
        event.preventDefault();
        const deltaY = event.touches[0].clientY - touchLastY;
        touchLastY = event.touches[0].clientY;
        addDistortionBurst(Math.abs(deltaY) * 0.02);
        scrollTarget -= deltaY * config.touchSpeed;
        isScrolling = true;
      }, { passive: false });

      window.addEventListener("touchend", () => {
        const swipeVelocity = (touchLastY - touchStartY) * 0.005;
        if (Math.abs(swipeVelocity) > 0.5) {
          scrollMomentum = -swipeVelocity * config.touchMomentum;
          addDistortionBurst(Math.abs(swipeVelocity) * 0.45);
          isScrolling = true;
          setTimeout(() => (isScrolling = false), 800);
        }
      });

      window.addEventListener("mousedown", (event) => {
        isDragging = true;
        dragStartY = event.clientY;
        dragDelta = 0;
        scrollMomentum = 0;
      });

      window.addEventListener("mousemove", (event) => {
        if (!isDragging) return;
        const deltaY = event.clientY - dragStartY;
        dragStartY = event.clientY;
        dragDelta = deltaY;
        addDistortionBurst(Math.abs(deltaY) * 0.02);
        scrollTarget -= deltaY * config.dragSpeed;
        isScrolling = true;
      });

      window.addEventListener("mouseup", () => {
        if (!isDragging) return;
        isDragging = false;
        if (Math.abs(dragDelta) > 2) {
          scrollMomentum = -dragDelta * config.dragMomentum;
          addDistortionBurst(Math.abs(dragDelta) * 0.005);
          isScrolling = true;
          setTimeout(() => (isScrolling = false), 800);
        }
      });

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate(time) {
        requestAnimationFrame(animate);
        const deltaTime = lastFrameTime ? (time - lastFrameTime) / 1000 : 0.016;
        lastFrameTime = time;
        const previousScroll = scrollPosition;

        if (isScrolling) {
          scrollTarget += scrollMomentum;
          scrollMomentum *= config.momentumFriction;
          if (Math.abs(scrollMomentum) < config.momentumThreshold) scrollMomentum = 0;
        }

        scrollPosition += (scrollTarget - scrollPosition) * config.smoothing;
        const frameDelta = scrollPosition - previousScroll;
        if (Math.abs(frameDelta) > 0.00001) directionTarget = frameDelta > 0 ? 1 : -1;
        scrollDirection += (directionTarget - scrollDirection) * 0.08;

        const velocity = Math.abs(frameDelta) / deltaTime;
        velocityHistory.push(velocity);
        velocityHistory.shift();
        const averageVelocity = velocityHistory.reduce((sum, value) => sum + value) / velocityHistory.length;
        if (averageVelocity > velocityPeak) velocityPeak = averageVelocity;

        const isDecelerating = averageVelocity / (velocityPeak + 0.001) < 0.7 && velocityPeak > 0.5;
        velocityPeak *= 0.99;
        if (velocity > 0.05) distortionTarget = Math.max(distortionTarget, Math.min(1, velocity * 0.1));
        if (isDecelerating || averageVelocity < 0.2) distortionTarget *= isDecelerating ? 0.95 : 0.855;
        distortionAmount += (distortionTarget - distortionAmount) * config.distortionSmoothing;

        const signedDistortion = distortionAmount * scrollDirection;
        let closestDistance = Infinity;
        let closestIndex = 0;

        meshes.forEach((mesh) => {
          const { offset } = mesh.userData;
          let positionY = -(offset - wrap(scrollPosition, loopLength));
          positionY = wrap(positionY + halfLoop, loopLength) - halfLoop;
          mesh.position.y = positionY;

          if (Math.abs(positionY) < closestDistance) {
            closestDistance = Math.abs(positionY);
            closestIndex = mesh.userData.index;
          }

          if (Math.abs(positionY) < halfLoop + config.maxHeight) {
            applyDistortion(mesh, positionY, config.distortionStrength * signedDistortion);
          }
        });

        if (closestIndex !== activeSlideIndex) {
          activeSlideIndex = closestIndex;
          titleElement.textContent = slides[activeSlideIndex].name;
          counterElement.textContent = String(activeSlideIndex + 1).padStart(2, "0");
        }

        renderer.render(scene, camera);
      }

      animate();
    </script>
    <script type="module" src="./nav.js"></script>
  </body>
</html>
